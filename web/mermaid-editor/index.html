<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Mermaid block editor</title>
    <link rel="stylesheet" href="./dist/editor.css">
  </head>
  <body>
    <main id="mermaid-app" class="mermaid-app">
      <div class="editor-grid">
        <textarea data-source aria-label="Mermaid source" spellcheck="false"></textarea>
        <section>
          <div class="status" data-status role="status"></div>
          <div class="direction-controls" role="group" aria-label="Graph direction">
            <button type="button" data-direction="TD">Top to bottom</button>
            <button type="button" data-direction="TB">Top to bottom (TB)</button>
            <button type="button" data-direction="LR">Left to right</button>
            <button type="button" data-direction="BT">Bottom to top</button>
            <button type="button" data-direction="RL">Right to left</button>
          </div>
          <div class="canvas-controls"><button type="button" data-zoom-out aria-label="Zoom out">−</button><button type="button" data-zoom-in aria-label="Zoom in">+</button><button type="button" data-canvas-reset>Reset view</button></div>
          <div class="canvas-viewport" data-canvas-viewport><div class="canvas" data-canvas></div></div>
          <aside data-inspector aria-label="Selected node inspector"></aside>
        </section>
      </div>
      <footer class="actions"><button type="button" data-cancel>Cancel</button><button type="button" data-confirm>Apply</button></footer>
    </main>
    <script src="./dist/editor.js"></script>
  </body>
</html>
